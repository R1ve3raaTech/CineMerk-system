<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | CineMerk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* OVERRIDE EVERYTHING FOR SCROLLING */
        body {
            background-color: #f0f2f5 !important;
            overflow-y: auto !important;
            height: auto !important;
            padding: 50px 10px !important;
            display: block !important;
        }

        .container-pro {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .form-input-group {
            margin-bottom: 20px;
        }

        .form-input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        .form-input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        /* EL GRAN BOTÓN ROJO */
        .btn-grande {
            width: 100%;
            background-color: #c1121f;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-grande:hover {
            background-color: #780001;
        }

        .volver {
            text-align: left;
            margin-bottom: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .volver a {
            color: #666;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="volver">
        <a href="login.html">← Volver a iniciar sesión</a>
    </div>

    <div class="container-pro">
        <div class="header">
            <i class="fas fa-user-plus" style="font-size: 3rem; color: #c1121f;"></i>
            <h1>Crear Cuenta</h1>
            <p>Por favor llene los datos:</p>
        </div>

        <br><br>

        <form id="ultra-register-form">
            <div class="form-input-group">
                <label>Nombre</label>
                <input type="text" id="r-firstName" required>
            </div>

            <br>

            <div class="form-input-group">
                <label>Apellido</label>
                <input type="text" id="r-lastName" required>
            </div>

            <br>

            <div class="form-input-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="r-username" required placeholder="Ej: kiko_pro">
            </div>

            <br>

            <div class="form-input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="r-email" required placeholder="correo@ejemplo.com">
            </div>

            <br>

            <div class="form-input-group">
                <label>Teléfono</label>
                <input type="tel" id="r-phone" required placeholder="8888-8888">
            </div>

            <br>

            <div class="form-input-group">
                <label>Cédula</label>
                <input type="text" id="r-idCard" required placeholder="1-1234-5678">
            </div>

            <br>

            <div class="form-input-group">
                <label>Fecha de Nacimiento</label>
                <input type="date" id="r-birthDate" required>
            </div>

            <br>

            <div class="form-input-group">
                <label>Contraseña</label>
                <input type="password" id="r-password" required>
            </div>

            <br><br>

            <button type="submit" class="btn-grande">REGISTRARSE AHORA</button>

            <br><br>

            <div style="text-align: center;">
                ¿Ya tiene cuenta? <a href="login.html"
                    style="color: #c1121f; font-weight: 700; text-decoration: none;">Inicie Sesión</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('ultra-register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userData = {
                firstName: document.getElementById('r-firstName').value.trim(),
                lastName: document.getElementById('r-lastName').value.trim(),
                phone: document.getElementById('r-phone').value,
                email: document.getElementById('r-email').value,
                idCard: document.getElementById('r-idCard').value,
                birthDate: document.getElementById('r-birthDate').value,
                username: document.getElementById('r-username').value.trim(),
                password: document.getElementById('r-password').value
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('cinema_user', JSON.stringify(user));

                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido!',
                        text: 'Cuenta creada con éxito.',
                        confirmButtonColor: '#c1121f'
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    const data = await res.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message || 'Error al crear cuenta.',
                        confirmButtonColor: '#c1121f'
                    });
                }
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Problema con el servidor', 'error');
            }
        });
    </script>
</body>

</html>
