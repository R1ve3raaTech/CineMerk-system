<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión | CineMerk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            padding: 3.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #dee2e6;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand-section i {
            font-size: 3.5rem;
            color: #c1121f;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 2rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        .input-group label {
            display: block;
            color: #495057;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c1121f;
            box-shadow: 0 0 0 4px rgba(193, 18, 31, 0.1);
        }

        .btn-login {
            width: 100%;
            background: #c1121f;
            color: #fff;
            border: none;
            padding: 1.1rem;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #780001;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(193, 18, 31, 0.3);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            color: #6c757d;
            font-size: 1rem;
        }

        .footer a {
            color: #c1121f;
            text-decoration: none;
            font-weight: 700;
        }

        .back-nav {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: #495057;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
        }

        .back-nav:hover {
            color: #c1121f;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-nav">
        <i class="fas fa-arrow-left"></i>
        <span>Volver</span>
    </a>

    <div class="login-card">
        <div class="brand-section">
            <i class="fas fa-film"></i>
            <h2>Acceso Socios</h2>
        </div>

        <form id="pro-login-form">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="l-username" required placeholder="Nombre de usuario">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="l-password" required placeholder="contraseña">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="footer">
            ¿No tiene una cuenta? <a href="register.html">Únase a CineMerk</a>
        </div>
    </div>

    <script>
        document.getElementById('pro-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('l-username').value;
            const password = document.getElementById('l-password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('cinema_user', JSON.stringify(user));

                    Swal.fire({
                        title: '¡Bienvenido!',
                        text: 'Ha iniciado sesión correctamente.',
                        icon: 'success',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    Swal.fire({
                        title: 'Error de Acceso',
                        text: 'Usuario o contraseña incorrectos.',
                        icon: 'error',
                        confirmButtonColor: '#c1121f'
                    });
                }
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            }
        });
    </script>
</body>

</html>
