<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMerk | Detalle del Producto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
            margin-top: 2rem;
        }

        .product-image-box {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image-box img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: contain;
            /* Assures full image is visible */
        }

        .product-info-box {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .product-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background: #fdf2f2;
            color: var(--primary);
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            width: fit-content;
        }

        .product-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            color: var(--text-dark);
        }

        .product-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .product-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .product-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 1.5rem 0;
            padding: 1.5rem 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .meta-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .meta-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        @media (max-width: 900px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-clapperboard"></i>
                <span>Cine<span>Merk</span></span>
            </div>
            <nav class="nav-menu">
                <a href="movies.html" class="nav-item">
                    <i class="fas fa-film"></i> Cartelera
                </a>
                <a href="index.html" class="nav-item active">
                    <i class="fas fa-hotdog"></i> Combos y Confitería
                </a>
                <a href="purchases.html" class="nav-item">
                    <i class="fas fa-shopping-bag"></i> Mis Compras
                </a>
                <a href="payments.html" class="nav-item">
                    <i class="fas fa-credit-card"></i> Formas de Pago
                </a>
                <a href="admin.html" id="admin-panel-link" class="nav-item"
                    style="display: none; text-decoration: none;">
                    <i class="fas fa-user-shield"></i> Panel Admin
                </a>
            </nav>
            <div class="sidebar-footer">
                <p>© 2026 CineMerk</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Detalle de Producto</h1>
                <div class="user-profile" id="user-profile-header">
                    <button class="cart-toggle" id="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge" id="cart-count">0</span>
                    </button>
                    <div id="auth-buttons">
                        <a href="login.html" class="btn btn-auth-login"><i class="fas fa-sign-in-alt"></i> Entrar</a>
                        <a href="register.html" class="btn btn-auth-register"><i class="fas fa-user-plus"></i> Crear
                            Cuenta</a>
                    </div>
                    <div id="user-info" style="display: none;" class="profile-summary">
                        <img id="user-avatar" src="" alt="Usuario">
                        <span id="user-name-display">Hola</span>
                        <button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </header>

            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver a Alimentos</a>

            <div id="product-detail" class="content-section active">
                <div class="product-detail-container">
                    <div class="product-image-box">
                        <img id="p-image" src="" alt="Cargando...">
                    </div>
                    <div class="product-info-box">
                        <span id="p-type" class="product-badge">ALIMENTO</span>
                        <h2 id="p-name" class="product-title">Cargando producto...</h2>
                        <div id="p-price" class="product-price">₡0</div>
                        <p id="p-description" class="product-description">
                            Cargando descripción detallada...
                        </p>

                        <div class="product-meta">
                            <div class="meta-item">
                                <span class="meta-label">Tamaño</span>
                                <span id="p-size" class="meta-value">N/A</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Estado</span>
                                <span id="p-status" class="meta-value">N/A</span>
                            </div>
                        </div>

                        <button id="add-to-cart-btn" class="btn btn-primary"
                            style="width: 100%; padding: 1.2rem; font-size: 1.1rem;">
                            <i class="fas fa-cart-plus"></i> Añadir al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts y Carrito (omitidos por brevedad pero main.js los maneja) -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Mi Carrito</h2>
            <button class="close-cart" id="close-cart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total:</span><span id="cart-total-amount">₡0</span></div>
            <button class="btn btn-primary" style="width: 100%;">Finalizar Compra</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch('/api/combos');
                const combos = await res.json();
                const product = combos.find(c => c.id === productId);

                if (!product) {
                    Swal.fire('Error', 'Producto no encontrado', 'error').then(() => {
                        window.location.href = 'index.html';
                    });
                    return;
                }

                // Render detail
                document.getElementById('p-image').src = product.image;
                document.getElementById('p-name').textContent = product.name;
                document.getElementById('p-price').textContent = product.price;
                document.getElementById('p-description').textContent = product.description;
                document.getElementById('p-type').textContent = product.type.toUpperCase();
                document.getElementById('p-size').textContent = product.size;
                document.getElementById('p-status').textContent = product.status.toUpperCase();

                document.title = `CineMerk | ${product.name}`;

                const addBtn = document.getElementById('add-to-cart-btn');
                if (product.status === 'inactivo') {
                    addBtn.disabled = true;
                    addBtn.textContent = 'No Disponible';
                    addBtn.classList.replace('btn-primary', 'btn-secondary');
                } else {
                    addBtn.onclick = () => {
                        window.addToCart({
                            name: product.name,
                            price: product.price,
                            image: product.image,
                            type: 'food'
                        });
                    };
                }

            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>

</html>
